<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu đáp án — Chính trị & PLĐC</title>
<style>
  :root{
    --paper:#f6f2ea;
    --ink:#1f2a24;
    --ink-soft:#4a564d;
    --line:#d8cfbd;
    --accent:#8a3b2b;
    --accent-soft:#c97b5f;
    --correct-bg:#e7efe0;
    --correct-border:#5c7a4c;
    --card:#fffdf8;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --serif: 'Georgia', 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: var(--serif);
    min-height:100vh;
  }
  header{
    padding:48px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(138,59,43,0.04), transparent);
  }
  .kicker{
    font-family: var(--mono);
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--accent);
    margin-bottom:10px;
  }
  h1{
    font-size:clamp(28px,4vw,42px);
    margin:0 0 8px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--ink-soft);
    font-size:15px;
    max-width:560px;
    margin:0 auto;
  }

  .search-wrap{
    max-width:760px;
    margin:-26px auto 0;
    padding:0 20px;
    position:relative;
    z-index:5;
  }
  .search-box{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:14px;
    box-shadow:6px 6px 0 rgba(31,42,36,0.12);
    display:flex;
    align-items:center;
    padding:6px 6px 6px 18px;
  }
  .search-box svg{flex:0 0 auto; opacity:0.55;}
  #search{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:var(--serif);
    font-size:18px;
    padding:14px 10px;
    color:var(--ink);
  }
  #search::placeholder{color:#9a927f;}
  .clear-btn{
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.05em;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
  }
  .clear-btn:hover{background:var(--accent);}

  .filters{
    max-width:760px;
    margin:16px auto 0;
    padding:0 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .chip{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.03em;
    border:1.3px solid var(--ink);
    background:var(--card);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
  }

  .meta-row{
    max-width:760px;
    margin:18px auto 0;
    padding:0 22px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:14px 20px 80px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent-soft);
    border-radius:10px;
    padding:20px 22px;
    margin:16px 0;
    box-shadow:0 1px 0 rgba(31,42,36,0.03);
  }
  .card-head{
    display:flex;
    gap:10px;
    align-items:baseline;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .tag{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    background:rgba(138,59,43,0.08);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .qnum{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .question{
    font-size:17px;
    line-height:1.5;
    margin:0 0 14px;
    font-weight:600;
  }
  .question mark, .opt mark{
    background:#f4d99a;
    color:inherit;
    padding:0 1px;
    border-radius:2px;
  }
  .options{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:8px;
  }
  .opt{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:15px;
    line-height:1.45;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid transparent;
    color:var(--ink-soft);
  }
  .opt .letter{
    font-family:var(--mono);
    font-weight:700;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .opt.correct{
    background:var(--correct-bg);
    border-color:var(--correct-border);
    color:var(--ink);
  }
  .opt.correct .letter{color:var(--correct-border);}
  .opt.correct::after{
    content:"✓ Đáp án đúng";
    margin-left:auto;
    font-family:var(--mono);
    font-size:11px;
    color:var(--correct-border);
    white-space:nowrap;
    padding-left:10px;
  }

  .empty, .hint{
    text-align:center;
    color:var(--ink-soft);
    font-family:var(--mono);
    font-size:13.5px;
    padding:60px 20px;
    line-height:1.8;
  }
  .empty strong, .hint strong{color:var(--ink);}

  footer{
    text-align:center;
    padding:30px 20px 50px;
    font-family:var(--mono);
    font-size:11.5px;
    color:#9a927f;
    border-top:1px solid var(--line);
  }

  @media (max-width:520px){
    header{padding:36px 16px 22px;}
    .card{padding:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="kicker">Ngân hàng câu hỏi ôn tập</div>
  <h1>Tra cứu đáp án</h1>
  <p class="sub">Gõ một phần câu hỏi hoặc số câu để tìm — đáp án đúng sẽ được đánh dấu ✓ ngay bên dưới.</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="search" type="text" placeholder="Tìm câu hỏi... (vd: chức năng nhà nước, câu 45, tư tưởng Hồ Chí Minh)" autocomplete="off">
    <button class="clear-btn" id="clearBtn" title="Xoá tìm kiếm">XOÁ</button>
  </div>
</div>

<div class="filters" id="filters">
  <button class="chip active" data-subject="all">Tất cả</button>
  <button class="chip" data-subject="Chính trị">Chính trị (300)</button>
  <button class="chip" data-subject="Pháp luật đại cương">PLĐC (150)</button>
</div>

<div class="meta-row">
  <span id="countLabel">— câu hỏi</span>
  <span>456 câu trong ngân hàng</span>
</div>

<main id="results"></main>

<footer>Dữ liệu tổng hợp từ đề cương ôn tập · Chỉ mang tính tham khảo, nên đối chiếu lại giáo trình gốc</footer>

<script>
let DATA = [];
let currentSubject = "all";

function stripDiacritics(str){
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g,"d").replace(/Đ/g,"D");
}
function norm(str){
  return stripDiacritics(str).toLowerCase();
}

function highlight(text, terms){
  if(!terms.length) return escapeHtml(text);
  let escaped = escapeHtml(text);
  // build a regex-safe pattern matching original text using normalized index mapping is complex;
  // simpler: do case-insensitive, diacritic-insensitive highlight via normalized comparison per word boundary approximate.
  terms.forEach(t=>{
    if(!t) return;
    const re = new RegExp("("+escapeRegExp(t)+")","gi");
    escaped = escaped.replace(re, "<mark>$1</mark>");
  });
  return escaped;
}
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function render(query){
  const resultsEl = document.getElementById('results');
  const countLabel = document.getElementById('countLabel');
  const q = query.trim();
  const qNorm = norm(q);

  let pool = currentSubject === "all" ? DATA : DATA.filter(d => d.subject === currentSubject);

  if(!qNorm){
    countLabel.textContent = pool.length + " câu hỏi";
    resultsEl.innerHTML = `<div class="hint">Nhập từ khoá ở ô tìm kiếm phía trên để bắt đầu.<br>Ví dụ: <strong>"chức năng nhà nước"</strong>, <strong>"câu 12"</strong>, <strong>"đại đoàn kết"</strong></div>`;
    return;
  }

  // "câu 12" style number search
  const numMatch = qNorm.match(/(?:cau|câu)\s*(\d+)/);

  let filtered = pool.filter(item=>{
    const hay = norm(item.question + " " + item.options.map(o=>o.text).join(" ") + " " + item.num);
    if(numMatch){
      return item.num === numMatch[1];
    }
    return hay.includes(qNorm);
  });

  countLabel.textContent = filtered.length + " kết quả";

  if(filtered.length === 0){
    resultsEl.innerHTML = `<div class="empty">Không tìm thấy câu hỏi phù hợp với <strong>"${escapeHtml(q)}"</strong>.<br>Thử từ khoá ngắn hơn hoặc kiểm tra chính tả.</div>`;
    return;
  }

  const terms = numMatch ? [] : [q];

  resultsEl.innerHTML = filtered.slice(0, 200).map(item=>{
    const optsHtml = item.options.map(o=>`
      <li class="opt ${o.correct ? 'correct' : ''}">
        <span class="letter">${o.letter}.</span>
        <span>${highlight(o.text, terms)}</span>
      </li>
    `).join("");
    return `
      <div class="card">
        <div class="card-head">
          <span class="tag">${item.subject}</span>
          <span class="qnum">Câu ${item.num}</span>
        </div>
        <p class="question">${highlight(item.question, terms)}</p>
        <ul class="options">${optsHtml}</ul>
      </div>
    `;
  }).join("");

  if(filtered.length > 200){
    resultsEl.innerHTML += `<div class="hint">Đang hiển thị 200/${filtered.length} kết quả đầu tiên — hãy thu hẹp từ khoá tìm kiếm.</div>`;
  }
}

async function init(){
  const res = await fetch('data.json');
  DATA = await res.json();
  document.getElementById('countLabel').textContent = DATA.length + " câu hỏi";

  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', ()=> render(searchInput.value));

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    searchInput.value = "";
    render("");
    searchInput.focus();
  });

  document.getElementById('filters').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    currentSubject = btn.dataset.subject;
    render(searchInput.value);
  });

  render("");
}

init();
</script>

</body>
</html>
